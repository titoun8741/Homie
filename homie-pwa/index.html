<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Homie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Homie</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5F3;--ink:#3A2A2E;--muted:#7A6468;--muted2:#6E585C;--a:#B5475C;--a-soft:#FCEBEC;--a-mid:#D9677C;--a-deco:#E8899A;--a-line:#F3C6CE;--a-dark:#8E3446;--peach:#DCEBDD;--peach-ink:#3C6A4E;--sage:#E1EDE4;--sage-ink:#3F6650;--track:#F3E3E1;--gray:#F4EEED;--fill:#B5475C;--on-a:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:#EEE4E2;font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 20px calc(120px + env(safe-area-inset-bottom));position:relative}
html,body{background:var(--bg)}
@media(min-width:480px){body{background:#EEE4E2}}
@media(min-width:480px){.app{box-shadow:0 0 40px rgba(120,60,70,.10)}}
.testbar{display:flex;align-items:center;gap:6px;padding:10px 0 2px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 5px;border-radius:17px;border:2px solid transparent;background:#fff;color:var(--muted2);font-size:12px;font-weight:700}
.pill.on{border-color:var(--a-line);color:var(--a);background:var(--a-soft)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 12px;gap:12px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hbtns{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:19px;border:none;background:#fff;box-shadow:0 4px 14px rgba(120,60,70,.10);display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none}
.iconbtn.primary{background:var(--fill);color:var(--on-a);box-shadow:0 6px 16px rgba(120,60,70,.28)}
.dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--a);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:26px;padding:16px 18px;box-shadow:0 4px 18px rgba(120,60,70,.06)}
.card.soft{background:var(--a-soft);box-shadow:none}
.card.accent{background:var(--fill);color:var(--on-a);box-shadow:none;position:relative;overflow:hidden}
.label{font-size:12px;font-weight:800;color:var(--a-dark);text-transform:uppercase;letter-spacing:.8px;margin:8px 0 0}
.card.accent .label{color:var(--on-a)}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:38px;font-weight:800;line-height:1}
.big small{font-size:16px;font-weight:700;color:var(--muted2)}
.card.accent .big small{color:var(--on-a)}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 10px 10px 12px;box-shadow:0 2px 10px rgba(120,60,70,.05)}
.row.soft{background:var(--a-soft);box-shadow:none}
.tile{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--a-soft);color:var(--a)}
.tile.b{background:var(--peach);color:var(--peach-ink)}
.tile.n{background:var(--gray);color:var(--muted2)}
.tile.w{background:#fff;color:var(--a)}
.tile.s{background:var(--sage);color:var(--sage-ink)}
.grow{flex:1;min-width:0;text-align:left;background:none;border:none;padding:4px 0;color:inherit}
.t-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t-meta .av{vertical-align:-4px;margin-right:4px}.t-meta .x2{margin-left:4px}
.pts{font-weight:800;color:var(--a)}
.x2{font-size:10px;font-weight:800;color:#2F5A41;background:var(--peach);padding:2px 6px;border-radius:8px}
.btn{height:38px;padding:0 14px;border-radius:14px;border:none;background:var(--fill);color:var(--on-a);font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--a);border:2px solid var(--a-line)}
.btn.soft{background:var(--a-soft);color:var(--a)}
.btn.peach{background:var(--peach);color:#2F5A41}
.btn.light{background:#fff;color:var(--a)}
.btn:disabled{background:var(--gray);color:var(--muted2);cursor:default;border:none}
.btn.sm{height:32px;font-size:12px;padding:0 11px;border-radius:12px}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:14px;background:var(--sage);color:var(--sage-ink);font-size:12px;font-weight:800;white-space:nowrap;flex:none}
.chip.wait{background:var(--gray);color:var(--muted2)}
.chip.pink{background:var(--a-soft);color:var(--a-dark)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.av.a{background:#F6D5DA;color:var(--a-dark)}.av.b{background:#DCEBDD;color:#3C6A4E}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--a-mid);transition:width .5s}
.card.soft .bar{background:#fff}
.segs{display:flex;gap:5px}.segs i{flex:1;height:10px;border-radius:5px;background:var(--track)}.segs i.on{background:var(--a-mid)}
.card.soft .segs i{background:#fff}.card.soft .segs i.on{background:var(--a-mid)}
.split{display:flex;height:12px;gap:3px}.split i{border-radius:6px;min-width:6px;transition:flex .5s}
.duo{display:flex;align-items:center;justify-content:space-between}
.duo .p{display:flex;flex-direction:column;align-items:center;gap:4px;width:100px}
.duo .p b{font-size:14px}.duo .p span{font-size:12px;color:var(--muted)}
.ring{border:3px solid #fff;box-shadow:0 0 0 2px var(--a-line)}
.flame{font-size:12px;font-weight:800;color:var(--a);display:flex;align-items:center;gap:4px;background:var(--a-soft);padding:4px 10px;border-radius:12px}
.seg{display:flex;background:#fff;border-radius:18px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border:none;border-radius:14px;background:none;color:var(--muted);font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--a-soft);color:var(--a);font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rcard{background:#fff;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 12px rgba(120,60,70,.06);position:relative}
.rcard.locked{border:2px dashed var(--a-line);box-shadow:none}
.rcard.used .tile,.rcard.used h3,.rcard.used .cost,.rcard.used .note{opacity:.5}.rcard.used{background:rgba(255,255,255,.6);box-shadow:none}
.rcard.req{background:var(--a-soft);box-shadow:none}
.rcard h3{margin:0;font-size:15px;font-weight:800;line-height:1.2}
.rcard .cost{font-size:13px;font-weight:800;color:var(--a)}
.rcard .note{font-size:11px;color:var(--muted2);font-weight:700}
.edit{position:absolute;top:6px;right:6px;width:44px;height:44px;border:none;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:14px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge .c{width:58px;height:58px;border-radius:29px;display:flex;align-items:center;justify-content:center;background:var(--gray);color:#9A8A8D}
.badge.on .c{background:var(--peach);color:var(--peach-ink);box-shadow:0 0 0 3px #fff,0 0 0 5px #A9CDB3}
.badge b{font-size:11px}.badge span{font-size:10px;color:var(--muted2)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:14px;background:#fff;border-radius:20px}
.stat{background:var(--bg);border-radius:14px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted2)}
nav.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(398px,calc(100% - 32px));height:68px;background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(120,60,70,.14);display:flex;align-items:center;justify-content:space-around;padding:0 4px;z-index:20}
nav.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 6px;min-width:56px;border-radius:16px;border:none;background:none;color:var(--muted);font-size:11px;font-weight:700}
nav.nav button[aria-current="page"]{background:var(--a-soft);color:var(--a);font-weight:800}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(58,42,46,.38);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadein .2s}
.sheet{background:var(--bg);width:100%;max-width:430px;border-radius:28px 28px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s ease-out}
.grab{position:sticky;top:-10px;z-index:3;width:auto;height:auto;margin:-10px -20px 0;padding:10px 0 12px;background:var(--bg);touch-action:none;cursor:grab;text-align:center}.grab:after{content:'';display:block;width:44px;height:5px;border-radius:3px;background:var(--a-line);margin:0 auto}.sheet.drag{transition:none}.sheet.back{transition:transform .22s ease-out}
.sheet h2{margin:0 0 14px;font-size:20px;font-weight:800}
.sheet form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:13px;font-weight:800;color:var(--muted2)}
input[type=text],input[type=number],input[type=email],input[type=password]{height:46px;border-radius:14px;border:2px solid var(--a-line);background:#fff;padding:0 14px;font:inherit;font-size:15px;color:var(--ink);width:100%}
:focus-visible{outline:3px solid var(--a-mid);outline-offset:2px}
.picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.opts input,.picker input{position:absolute;opacity:0;pointer-events:none}
.picker label{display:block;cursor:pointer}
.picker span{height:46px;border-radius:14px;background:#fff;color:var(--muted2);display:flex;align-items:center;justify-content:center;border:2px solid transparent}
.picker input:checked+span{background:var(--fill);color:var(--on-a)}
.picker input:focus-visible+span,.opts input:focus-visible+span{outline:3px solid var(--a-mid);outline-offset:2px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{cursor:pointer}
.opts span{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:14px;background:#fff;color:var(--muted2);font-size:13px;font-weight:700}
.opts input:checked+span{background:var(--a-soft);color:var(--a);font-weight:800;box-shadow:inset 0 0 0 2px var(--a-line)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:16px;padding:10px 14px;min-height:56px;cursor:pointer}
.toggle .txt b{display:block;font-size:14px}.toggle .txt span{font-size:12px;color:var(--muted)}
.toggle input{position:absolute;opacity:0}
.toggle .sw{width:48px;height:28px;border-radius:14px;background:#E3D6D4;position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .2s}
.toggle input:checked+.sw{background:var(--a)}
.toggle input:checked+.sw::after{transform:translateX(20px)}
.toggle input:focus-visible+.sw{outline:3px solid var(--a-mid);outline-offset:2px}
.swatches{display:flex;gap:10px}
.swatch{width:44px;height:44px;border-radius:22px;border:3px solid #fff;box-shadow:0 0 0 2px transparent}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.actions{display:flex;gap:10px}.actions .btn{flex:1}
.danger{color:#A33A3A;background:none;border:none;font-weight:800;font-size:13px;height:44px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:700;z-index:60;width:max-content;max-width:min(340px,90vw);text-align:center;animation:toast 2.8s forwards;pointer-events:none}
.float{position:fixed;left:50%;top:38%;font-size:40px;font-weight:800;color:var(--a);z-index:70;pointer-events:none;animation:rise 1.2s forwards;text-shadow:0 2px 0 #fff}
.heartfx{position:fixed;bottom:25%;z-index:70;pointer-events:none;animation:fly 1.7s ease-out forwards}
.ob{min-height:calc(100vh - 60px);display:flex;flex-direction:column;padding:4px 0 32px}
.ob form{display:flex;flex-direction:column;gap:16px;flex:1}
.obtop{display:flex;align-items:center;gap:12px;height:52px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}.dots i{width:8px;height:8px;border-radius:4px;background:var(--a-line);transition:width .3s}.dots i.on{width:24px;background:var(--a)}
.ob h1{font-size:28px;line-height:1.15}
.lead{font-size:15px;color:var(--muted2);margin:-6px 0 0;line-height:1.45}
.hero{position:relative;height:190px;display:flex;align-items:center;justify-content:center}
.feat{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:12px 14px}
.feat b{display:block;font-size:14px}.feat span{font-size:12px;color:var(--muted)}
.picklist{display:flex;flex-direction:column;gap:8px}
.pick{position:relative;display:block;cursor:pointer}
.pick input{position:absolute;opacity:0}
.pk{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:8px 12px 8px 8px;border:2px solid transparent}
.pick input:checked+.pk{border-color:var(--a-line);background:var(--a-soft)}
.pick input:focus-visible+.pk{outline:3px solid var(--a-mid);outline-offset:2px}
.pk .nm{flex:1;font-size:14px;font-weight:700}
.ck{width:26px;height:26px;border-radius:13px;border:2px solid var(--a-line);display:flex;align-items:center;justify-content:center;color:transparent;flex:none;background:#fff}
.pick input:checked+.pk .ck{background:var(--a);border-color:var(--a);color:#fff}
.code{font-size:30px;font-weight:800;letter-spacing:4px;text-align:center;background:#fff;border:2px dashed var(--a-line);border-radius:20px;padding:20px;color:var(--a-dark)}
.spacer{flex:1}
.av.ghost{background:#fff;color:var(--muted);border:2px dashed var(--a-line)}
.check{display:flex;align-items:center;gap:12px;min-height:40px}
.check.ok .ck{background:var(--sage-ink);border-color:var(--sage-ink);color:#fff}
.check .txt{flex:1;font-size:14px;font-weight:700}
.check.ok .txt{text-decoration:line-through;color:var(--muted)}
.pill:disabled{opacity:.5;cursor:default}
.pill.txt{padding:0 12px}
.t-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;line-height:1.25}.t-meta{display:block}
[hidden]{display:none!important}
.duoav{display:inline-flex;vertical-align:-4px;margin-right:4px}.t-meta .duoav .av{margin-right:0}.duoav .av+.av{margin-left:-6px;box-shadow:0 0 0 1.5px #fff}
.cx{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(120,60,70,.05);overflow:hidden}
.row.flat{box-shadow:none;background:transparent}
.steps{display:flex;flex-direction:column;padding:0 12px 8px 66px}
.step{display:flex;align-items:center;gap:10px;min-height:40px;border:none;background:none;padding:2px 0;text-align:left;color:var(--ink);font-size:13px;font-weight:700}
.step .ck{width:22px;height:22px}.step .st{flex:1}
.step.ok .ck{background:var(--sage-ink);border-color:var(--sage-ink);color:#fff}
.step.ok .st{text-decoration:line-through;color:var(--muted)}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px;margin-left:4px;background:var(--a-soft);color:var(--a-dark)}
textarea{border-radius:14px;border:2px solid var(--a-line);background:#fff;padding:10px 14px;font:inherit;font-size:15px;color:var(--ink);width:100%;min-height:100px;resize:vertical}
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daypick label{cursor:pointer;position:relative}.daypick input{position:absolute;opacity:0}
.daypick span{height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted2)}
.daypick input:checked+span{background:var(--fill);color:var(--on-a)}
.daypick input:focus-visible+span{outline:3px solid var(--a-mid);outline-offset:2px}
.avrow{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 6px}
.avopt{width:60px;height:60px;border-radius:20px;border:3px solid transparent;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.avopt[aria-pressed="true"]{border-color:var(--a)}
.cdot{width:40px;height:40px;border-radius:20px;border:3px solid #fff;flex:none;box-shadow:0 0 0 2px transparent;padding:0}
.cdot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.avedit{position:relative;border:none;background:none;padding:0;border-radius:50%;display:inline-flex}
.avedit .pen,.duo .p .avedit .pen,.avedit .pen svg.i,.duo .p .avedit .pen svg.i{color:#FFFFFF;stroke:#FFFFFF}
.avedit .pen{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:12px;background:var(--fill);color:var(--on-a);display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.sw{position:relative;border-radius:20px;overflow:hidden}
.sw-bg{position:absolute;inset:0;display:none;align-items:center;border-radius:20px}
.sw[data-dir="l"] .sw-del{display:flex}.sw[data-dir="r"] .sw-un{display:flex}
.sw-del{justify-content:flex-end;background:#9E3346}
.sw-un{justify-content:flex-start;background:var(--peach);color:#2F5A41;padding-left:18px;gap:8px;font-size:13px;font-weight:800}
.sw-btn{height:100%;width:96px;border:none;background:none;color:#FFF8F2;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sw-front{position:relative;touch-action:pan-y;transition:transform .22s ease-out;user-select:none;-webkit-user-select:none}
.together{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.together .n{font-size:30px;font-weight:800;line-height:1;margin-top:4px}
.together .l{font-size:12px;color:var(--muted);font-weight:700}
.milestone{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--a-line);font-size:12px;color:var(--muted2);font-weight:700}
.milestone.cel{margin-top:14px;padding:11px 14px;border-top:none;border-radius:16px;background:#A23A50;color:#FFFFFF;font-size:13px;font-weight:800;text-align:center}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}.rain i{position:absolute;top:-40px;display:block;animation:rainf linear forwards}@keyframes rainf{to{transform:translateY(115vh) rotate(var(--r,0deg))}}
input[type=date]{height:46px;border-radius:14px;border:2px solid var(--a-line);background:#fff;padding:0 14px;font:inherit;font-size:15px;color:var(--ink);width:100%}
.row.late,.cx.late{background:var(--a-soft);box-shadow:inset 0 0 0 2px var(--a-mid)}.cx.late .row.flat{background:transparent;box-shadow:none}
.tile.r{background:#fff;color:var(--a-dark)}
.tag.lt{background:var(--fill);color:var(--on-a)}
.err{margin:0;font-size:13px;font-weight:700;color:#A3452A;display:flex;gap:6px;align-items:center}
.codein{font-size:26px!important;letter-spacing:8px;text-align:center;font-weight:800!important;height:58px!important}
.linkbtn{background:none;border:none;color:var(--a);font-weight:800;font-size:14px;height:44px;padding:0 6px}
.choice{display:flex;gap:14px;align-items:center;width:100%;background:#fff;border:none;border-radius:22px;padding:16px;text-align:left;box-shadow:0 2px 12px rgba(120,60,70,.06)}
.choice b{display:block;font-size:15px}.choice span{font-size:12px;color:var(--muted)}
.flip{display:flex;justify-content:center;align-items:center;gap:26px;padding:14px 0 6px}
.fp{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.38;transform:scale(.94);transition:opacity .1s,transform .1s}
.fp b{font-size:15px}.fp .ring{border-radius:50%;display:inline-flex;transition:box-shadow .1s}
.fp.on{opacity:1;transform:scale(1.06)}.fp.on .ring{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--a-mid)}
.fres{margin:0;text-align:center;font-size:22px;font-weight:800;color:var(--a);min-height:30px}
.cbtn{width:36px;height:36px;border-radius:18px;border:none;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;background:var(--fill);color:var(--on-a)}
.cbtn.ghost{background:#fff;color:var(--a);box-shadow:inset 0 0 0 2px var(--a-line)}
.cbtn.soft{background:var(--a-soft);color:var(--a)}.row.late .cbtn.soft{background:#fff}
.cbtn.off{background:var(--gray);color:var(--muted2);cursor:default}
.cbtn.sm{width:30px;height:30px}
.hint{font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:8px;margin:0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.1)}}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-300px) scale(1.2) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav b{font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 2px 10px rgba(120,60,70,.05)}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:2px}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:8px}
.legend .lg .t{font-size:13px;font-weight:800}.legend .lg .s{font-size:11px;color:var(--muted)}
.sw2{width:10px;height:10px;border-radius:3px;flex:none}
.trow{display:flex;align-items:center;gap:10px;padding:6px 0}
.trow .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .mini{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:4px}
.trow .mini i{border-radius:3px}

function nextCap(d){

function periodKey(P,off){return P==='week'?S.week+off:mKey(dateOf(S.week,S.day))+off;}

  S.log.forEach(function(e){if(e.type==='seed'||!e.week||!inPeriod(e,P,k))return;if(upto&&(P==='week'?e.day>S.day:dateOf(e.week,e.day).getDate()>dom))return;if(e.type==='reward'){r.rw++;return;}if(e.type!=='task')return;
    r.n++;r[e.who]++;r['p'+e.who]+=e.pts;r.days[e.day-1]++;var nmT=String(e.text).replace(' (à deux)','');var t=r.tasks[nmT]||(r.tasks[nmT]={n:0,a:0,b:0,icon:e.icon});t.n++;t[e.who]++;});return r;}
function delta(c,p,live){if(!p)return c?'nouveau':'';var d=Math.round((c-p)/p*100);return (d>0?'+':'')+d+' % vs '+(live?'même moment avant':'période d\'avant');}

function complete(t,who,pts){
  var people=t.assignee==='both'?['a','b']:[who],ids=[];
  people.forEach(function(p){var id=uid();ids.push(id);addLog({id:id,type:'task',who:p,text:t.name+(people.length>1?' (à deux)':''),icon:t.icon,pts:pts,by:S.settings.validation&&S.joined?S.me:null});});
  t.logIds=ids;t.status='done';t.doneBy=who;t.forgottenDays=0;t.late=false;delete t.pendingPts;
  floatPts('+'+pts+(people.length>1?' chacun':''));checkChallenge();checkBadges();
}
function unlockReward(r){
  var p=pot();if(p<r.cost){toast('Pas encore assez de points');r.status='available';return;}
  addLog({type:'reward',who:'both',text:r.name+' débloquée',icon:r.icon,pts:-r.cost});r.status='unlocked';delete r.requestedBy;
  hearts();toast(r.name+' : c\'est débloqué !');checkBadges();
}
function resetTask(t){t.status='todo';t.doneBy=null;t.logIds=[];t.late=false;(t.steps||[]).forEach(function(s){s.done=false;s.by=null;});}
function dueMap(){var m={};S.tasks.forEach(function(t){m[t.id]=isDue(t);});return m;}
function newDay(){
  var due=dueMap();S.day++;if(S.day>7){newWeek(due);return;}
  var wd=S.day-1;
  S.tasks.forEach(function(t){
    if(t.status==='todo'&&due[t.id]){t.forgottenDays=(t.forgottenDays||0)+1;if(t.recurrence==='days')t.late=true;}
    if(t.status==='done'&&(t.recurrence==='daily'||(t.recurrence==='days'&&(t.days||[]).indexOf(wd)>=0)))resetTask(t);
  });
}
function newWeek(due){
  due=due||dueMap();
  S.week++;S.day=1;S.challengeDone=false;S.chIndex=((S.chIndex||0)+1)%CHALLENGES.length;S.challenge=JSON.parse(JSON.stringify(CHALLENGES[S.chIndex]));
  S.tasks.forEach(function(t){if(t.status==='todo'&&due[t.id]){t.forgottenDays=(t.forgottenDays||0)+1;if(t.recurrence==='days')t.late=true;}else if(t.status==='done'&&t.recurrence!=='once')resetTask(t);});
}

    D.email=email;saveD();SESSION=r.data.session;AUTH.view='choice';BOOTING=true;render();await loadMembership();},
  join:async function(fd){var code=String(fd.get('code')||'').trim().toUpperCase().replace(/\s/g,'');if(code&&code.indexOf('HOMIE-')!==0)code='HOMIE-'+code;
    AUTH.busy=true;AUTH.err='';render();var r;try{r=await sb.rpc('join_couple',{p_code:code});}catch(e){r={error:e};}
    AUTH.busy=false;if(r.error){AUTH.err=frErr(r.error);render();return;}
    D.coupleId=r.data.id;D.me='b';saveD();BOOTING=true;render();await loadMembership();hearts();toast('Bienvenue '+nm('b')+' !');},
  ob:async function(fd){var st=S.onboard;
    if(st===1){S.names.a=fd.get('na').trim();S.names.b=fd.get('nb').trim();S.since=fd.get('since')||null;S.onboard=2;}
    else if(st===2){S.ob.tasks=fd.getAll('tk');S.onboard=3;}
    else if(st===3){S.ob.rewards=fd.getAll('rw');S.goal={name:fd.get('goal').trim()||'Week-end en amoureux',target:+fd.get('target')||1000,icon:'suitcase'};
      S.tasks=S.ob.tasks.map(function(i){var p=PRESET_TASKS[+i];return{id:uid(),name:p[0],icon:p[1],points:p[2],assignee:null,recurrence:p[3],days:p[4]||[],status:'todo',forgottenDays:0,steps:[]};});
      S.rewards=S.ob.rewards.map(function(i){var p=PRESET_REWARDS[+i];return{id:uid(),name:p[0],icon:p[1],cost:p[2],by:'a',status:'available'};});
      S.joined=false;S.lastDate=todayISO();S.me='a';
      var btn=document.querySelector('.ob button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Création…';}
      var r;try{r=await sb.rpc('create_couple',{p_data:sharedOf(S)});}catch(e){r={error:e};}
      if(r.error){toast(frErr(r.error));if(btn){btn.disabled=false;btn.textContent='C\'est parti';}return;}
      D.coupleId=r.data.id;D.me='a';saveD();S.code=r.data.code;lastSynced=JSON.stringify(sharedOf(S));subscribe();S.onboard=4;}
    else if(st===4){S.onboard=null;S.ui.screen='home';render();window.scrollTo(0,0);hearts();toast('Bienvenue '+nm('a')+' !');return;}
    render();window.scrollTo(0,0);},
  task:function(fd,f){var id=f.dataset.id,t=id?byId(S.tasks,id):{id:uid(),status:'todo',forgottenDays:0};
    t.name=fd.get('name').trim()||'Tâche';t.icon=fd.get('icon')||'sparkle';t.points=+fd.get('points')||10;t.assignee=fd.get('assignee')||null;t.recurrence=fd.get('recurrence')||'weekly';
    t.days=fd.getAll('days').map(Number);if(t.recurrence==='days'&&!t.days.length)t.days=[S.day-1];
    t.complex=!!fd.get('complex');var old=t.steps||[];
    t.steps=t.complex?String(fd.get('steps')||'').split('\n').map(function(s){return s.trim();}).filter(Boolean).map(function(x){return old.filter(function(s){return s.t===x;})[0]||{t:x,done:false};}):[];
    if(t.complex&&!t.steps.length)t.complex=false;
    if(!id)S.tasks.push(t);closeSheet();render();toast(id?'Tâche modifiée':'Tâche ajoutée');},
  reward:function(fd,f){var id=f.dataset.id,r=id?byId(S.rewards,id):{id:uid(),status:'available',by:S.me};
    r.name=fd.get('name').trim()||'Récompense';r.icon=fd.get('icon')||'gift';r.cost=+fd.get('cost')||100;r.surprise=!!fd.get('surprise');
    if(!id)S.rewards.push(r);closeSheet();render();toast(id?'Récompense modifiée':'Récompense ajoutée');},
  goal:function(fd){S.goal={name:fd.get('name').trim()||'Objectif',target:Math.max(50,+fd.get('target')||1000),icon:fd.get('icon')||'suitcase'};closeSheet();render();},
  challenge:function(fd){S.challenge={name:fd.get('name').trim()||'Défi',filter:fd.get('filter')||'any',target:+fd.get('target')||5,bonus:+fd.get('bonus')||50};S.challengeDone=false;closeSheet();checkChallenge();render();},
  settings:function(fd){S.since=fd.get('since')||S.since;S.names.a=fd.get('na').trim()||'Moi';S.names.b=fd.get('nb').trim()||'Toi';S.settings.validation=!!fd.get('validation');S.settings.forgotten=!!fd.get('forgotten');S.settings.forgottenDays=+fd.get('fdays')||7;
    if(!S.settings.validation){S.tasks.forEach(function(t){if(t.status==='pending')complete(t,t.doneBy,t.pendingPts||t.points);});S.rewards.forEach(function(r){if(r.status==='requested')unlockReward(r);});}
    closeSheet();render();toast('Réglages enregistrés');}
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var f=ACT[b.dataset.act];if(f){if(b.tagName==='BUTTON'&&b.type!=='submit'||b.dataset.act!=='noop')e.stopPropagation();f(b.dataset.v,b);}});
document.addEventListener('submit',function(e){e.preventDefault();var f=e.target;if(FORMS[f.dataset.form])FORMS[f.dataset.form](new FormData(f),f);});
document.addEventListener('change',function(e){var n=e.target.name;if(n==='recurrence'){var f=document.getElementById('days-field');if(f)f.hidden=e.target.value!=='days';}if(n==='complex'){var g=document.getElementById('steps-field');if(g)g.hidden=!e.target.checked;}});
var drag=null,openSw=null,suppress=false;
function closeSw(sw){if(!sw)return;var f=sw.querySelector('.sw-front');if(f)f.style.transform='';if(openSw===sw)openSw=null;}
document.addEventListener('pointerdown',function(e){
  if(openSw&&!openSw.contains(e.target))closeSw(openSw);
  var f=e.target.closest('.sw-front');if(!f||e.button>0)return;
  drag={el:f,sw:f.parentNode,x:e.clientX,y:e.clientY,v:null,lock:null,base:f.parentNode===openSw?-96:0};
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.lock&&(Math.abs(dx)>8||Math.abs(dy)>8))drag.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(drag.lock!=='x')return;e.preventDefault();
  var v=drag.base+dx,un=drag.sw.dataset.un==='1';
  if(v>0&&!un)v=v*0.15;v=Math.max(-150,Math.min(170,v));
  drag.el.style.transition='none';drag.el.style.transform='translateX('+v+'px)';drag.sw.dataset.dir=v<0?'l':'r';drag.v=v;
},{passive:false});
function endDrag(){
  if(!drag)return;var d=drag;drag=null;d.el.style.transition='';
  if(d.lock!=='x'){if(d.base&&d.lock===null){closeSw(d.sw);suppress=true;}return;}
  suppress=true;var v=d.v||0;
  if(v<-60){d.el.style.transform='translateX(-96px)';openSw=d.sw;}
  else if(v>90&&d.sw.dataset.un==='1'){d.el.style.transform='translateX(110%)';setTimeout(function(){var t=byId(S.tasks,d.sw.dataset.sw);if(!t)return;var w=t.assignee;t.assignee=null;render();toast('« '+t.name+' » n\'est plus affectée'+(w&&w!=='both'?' à '+nm(w):''));},200);}
  else{d.el.style.transform='';if(openSw===d.sw)openSw=null;}
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('click',function(e){if(suppress){suppress=false;e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('pointerdown',function(){suppress=false;},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
(function(){var g=null;
document.addEventListener('pointerdown',function(e){var sh=e.target.closest&&e.target.closest('.sheet');if(!sh)return;var onBar=!!e.target.closest('.sheet>.grab');if(!onBar&&sh.scrollTop>0)return;var it=e.target.closest('button,input,select,textarea,label,a,[data-act]');if(it&&it!==sh)return;if(!onBar&&e.clientY-sh.getBoundingClientRect().top>110)return;g={sh:sh,y:e.clientY,dy:0,t:Date.now(),id:e.pointerId};sh.classList.remove('back');sh.classList.add('drag');try{sh.setPointerCapture(e.pointerId);}catch(x){}});
document.addEventListener('pointermove',function(e){if(!g||e.pointerId!==g.id)return;g.dy=Math.max(0,e.clientY-g.y);g.sh.style.transform='translateY('+g.dy+'px)';});
function end(e){if(!g||e.pointerId!==g.id)return;var sh=g.sh,dy=g.dy,v=dy/Math.max(1,Date.now()-g.t);g=null;sh.classList.remove('drag');
 if(dy>90||(dy>30&&v>0.6)){sh.classList.add('back');sh.style.transform='translateY(100%)';setTimeout(closeSheet,180);}
 else{sh.classList.add('back');sh.style.transform='';}}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);})();

function syncClock(){
  if(S.onboard!=null)return false;
  var t=todayISO();if(!S.lastDate){S.lastDate=t;return false;}
  var a=new Date(S.lastDate+'T00:00:00'),b=new Date(t+'T00:00:00'),n=Math.round((b-a)/86400000);
  if(n<=0)return false;var w0=S.week;
  for(var i=0;i<Math.min(n,21);i++)newDay();
  S.day=((b.getDay()+6)%7)+1;S.lastDate=t;
  return true;
}
async function boot(){
  if(!CFG_OK){BOOTING=false;render();return;}
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'homie-auth'}});
  sb.auth.onAuthStateChange(function(ev,sess){SESSION=sess;});
  var r;try{r=await sb.auth.getSession();}catch(e){r={data:{}};}
  SESSION=r.data&&r.data.session;
  if(!SESSION){BOOTING=false;render();return;}
  if(D.coupleId&&S.onboard==null){S.me=D.me||'a';BOOTING=false;syncClock();render();rainCheck();}
  await loadMembership();
}
function rainCheck(){try{var rk='homie-rain-'+new Date().toDateString(),cap0=nextCap(daysTogether());if(cap0&&cap0.cel&&!sessionStorage.getItem(rk)){sessionStorage.setItem(rk,'1');heartRain();}}catch(e){}}
render();boot();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&SESSION&&D.coupleId)loadMembership();});
window.addEventListener('online',function(){lastSynced=null;push();});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
